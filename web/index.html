<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RelayForge — Developer Console</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F2F2F5'><path d='M13 10V3L4 14h7v7l9-11h-7z'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-0: #0E0E10;
        --color-1: #232327;
        --color-2: #3E3E45;
        --color-3: #63636E;
        --color-4: #9A9AA6;
        --color-5: #C9C9D2;
        --color-6: #F2F2F5;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #0E0E10;
        color: #F2F2F5;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      code, pre {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom scrollbar matching monochromatic palette */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0E0E10;
      }
      ::-webkit-scrollbar-thumb {
        background: #3E3E45;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #63636E;
      }

      /* Responsive Layout Utilities */
      .rf-stats-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 24px;
        width: 100%;
        box-sizing: border-box;
      }
      .rf-nav-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 24px;
        width: 100%;
        box-sizing: border-box;
      }
      @media (max-width: 1200px) {
        .rf-stats-grid, .rf-nav-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
        }
      }
      @media (max-width: 640px) {
        .rf-stats-grid, .rf-nav-grid {
          grid-template-columns: 1fr;
          gap: 12px;
          margin-bottom: 20px;
        }
      }

      .rf-sidebar-desktop {
        display: flex !important;
        flex-shrink: 0;
        height: 100vh;
        position: relative;
        z-index: 10;
        transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .rf-sidebar-mobile-backdrop {
        display: none;
      }
      .rf-mobile-menu-btn {
        display: none !important;
      }
      @media (max-width: 768px) {
        .rf-sidebar-desktop {
          display: none !important;
        }
        .rf-mobile-menu-btn {
          display: flex !important;
        }
        .rf-sidebar-mobile-backdrop {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.75);
          backdrop-filter: blur(4px);
          z-index: 99;
        }
      }

      .rf-main-content {
        flex: 1;
        padding: 32px 36px;
        overflow-y: auto;
        overflow-x: hidden;
        background-color: #0E0E10;
        color: #F2F2F5;
        box-sizing: border-box;
        min-width: 0;
      }
      @media (max-width: 1024px) {
        .rf-main-content {
          padding: 24px 28px;
        }
      }
      @media (max-width: 768px) {
        .rf-main-content {
          padding: 20px 18px;
        }
      }

      .rf-header-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
      }
      @media (max-width: 640px) {
        .rf-header-row {
          flex-direction: column;
          align-items: stretch;
          gap: 14px;
          margin-bottom: 18px;
        }
        .rf-header-btn-wrap {
          width: 100%;
        }
        .rf-header-btn-wrap button {
          width: 100%;
          justify-content: center;
        }
      }

      .rf-topbar-search {
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: #121215;
        border: 1px solid #2C2C32;
        border-radius: 999px;
        padding: 7px 14px;
        width: 250px;
      }
      @media (max-width: 900px) {
        .rf-topbar-search {
          width: 180px;
        }
      }
      @media (max-width: 680px) {
        .rf-topbar-search {
          display: none;
        }
        .rf-topbar-pill-text {
          display: none;
        }
      }

      .rf-table-responsive {
        width: 100%;
        overflow: visible;
        border-radius: 16px;
        background-color: transparent;
        min-height: auto;
        padding-bottom: 0;
      }

      .rf-filter-pills {
        display: flex;
        gap: 8px;
        margin-bottom: 22px;
        align-items: center;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding: 4px 0;
        width: 100%;
      }
      .rf-filter-pills::-webkit-scrollbar {
        display: none;
      }
    
      /* Mobile & Touch Responsiveness for Landing & Modal */
      .rf-landing-header {
        height: 68px;
        transition: padding 0.2s ease;
      }
      @media (max-width: 640px) {
        .rf-landing-header {
          padding: 0 16px !important;
          height: 60px !important;
        }
        .rf-landing-badge {
          display: none !important;
        }
      }

      @media (max-width: 768px) {
        .rf-signin-modal {
          flex-direction: column !important;
          max-width: 94vw !important;
          max-height: 92vh !important;
          overflow-y: auto !important;
          border-radius: 16px !important;
        }
        .rf-signin-modal-graphic {
          display: none !important;
        }
        .rf-signin-modal-content {
          flex: 1 1 100% !important;
          padding: 28px 20px !important;
        }
      }

      /* Mobile touch target minimums */
      @media (hover: none) and (pointer: coarse), (max-width: 640px) {
        button, a[role="button"], input[type="button"], input[type="submit"] {
          min-height: 44px;
        }
      }

    
      .rf-sidebar-collapsed {
        width: 68px !important;
      }
    </style>
  </head>
  <body>
    <div style="position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;">
      <svg style="position: absolute; top: -60px; right: -80px; width: 1100px; height: 550px; opacity: 0.85;" viewBox="0 0 1100 550" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1150 60C880 100 720 280 400 210C220 170 100 250 -40 290" stroke="url(#goldGrad)" stroke-width="2.2" opacity="0.7"/>
        <path d="M1150 90C830 140 680 320 370 240C190 190 80 280 -40 330" stroke="url(#goldGrad2)" stroke-width="1.4" opacity="0.5"/>
        <path d="M1150 40C920 80 760 250 420 190C250 150 120 230 -40 260" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.35"/>
        <circle cx="740" cy="190" r="160" fill="url(#radialGlow)" opacity="0.22"/>
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C5A059" stop-opacity="0"/>
            <stop offset="35%" stop-color="#E5C58A" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#D4AF78" stop-opacity="0.65"/>
            <stop offset="100%" stop-color="#9A7B44" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E5C58A" stop-opacity="0"/>
            <stop offset="50%" stop-color="#F3DCB0" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="radialGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#E5C58A" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#E5C58A" stop-opacity="0"/>
          </radialGradient>
        </defs>
      </svg>
    </div>
    <div id="root" style="position: relative; z-index: 1;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
