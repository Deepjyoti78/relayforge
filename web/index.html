<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RelayForge — Developer Console</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F2F2F5'><path d='M13 10V3L4 14h7v7l9-11h-7z'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-0: #000000;
        --color-1: #202020;
        --color-2: #2A2A2A;
        --color-3: #737373;
        --color-4: #A3A3A3;
        --color-5: #E5E5E5;
        --color-6: #FFFFFF;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #000000;
        color: #FFFFFF;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      code, pre {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom scrollbar matching monochromatic palette */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #2A2A2A;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #737373;
      }

      /* Responsive Layout Utilities */
      .rf-stats-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 24px;
        width: 100%;
        box-sizing: border-box;
      }
      .rf-nav-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 24px;
        width: 100%;
        box-sizing: border-box;
      }
      @media (max-width: 1200px) {
        .rf-stats-grid, .rf-nav-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
        }
      }
      @media (max-width: 640px) {
        .rf-stats-grid, .rf-nav-grid {
          grid-template-columns: 1fr;
          gap: 12px;
          margin-bottom: 20px;
        }
      }

      .rf-sidebar-desktop {
        display: flex !important;
        flex-shrink: 0;
        height: 100vh;
        position: relative;
        z-index: 10;
        transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .rf-sidebar-mobile-backdrop {
        display: none;
      }
      .rf-mobile-menu-btn {
        display: none !important;
      }
      @media (max-width: 768px) {
        .rf-sidebar-desktop {
          display: none !important;
        }
        .rf-mobile-menu-btn {
          display: flex !important;
        }
        .rf-sidebar-mobile-backdrop {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.75);
          backdrop-filter: blur(4px);
          z-index: 99;
        }
      }

      .rf-main-content {
        flex: 1;
        padding: 32px 36px;
        overflow-y: auto;
        overflow-x: hidden;
        background-color: #000000;
        color: #FFFFFF;
        box-sizing: border-box;
        min-width: 0;
      }
      @media (max-width: 1024px) {
        .rf-main-content {
          padding: 24px 28px;
        }
      }
      @media (max-width: 768px) {
        .rf-main-content {
          padding: 20px 18px;
        }
      }

      .rf-header-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
      }
      @media (max-width: 640px) {
        .rf-header-row {
          flex-direction: column;
          align-items: stretch;
          gap: 14px;
          margin-bottom: 18px;
        }
        .rf-header-btn-wrap {
          width: 100%;
        }
        .rf-header-btn-wrap button {
          width: 100%;
          justify-content: center;
        }
      }

      .rf-topbar-search {
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: #0A0A0A;
        border: 1px solid #2A2A2A;
        border-radius: 999px;
        padding: 7px 14px;
        width: 250px;
      }
      @media (max-width: 900px) {
        .rf-topbar-search {
          width: 180px;
        }
      }
      @media (max-width: 680px) {
        .rf-topbar-search {
          display: none;
        }
        .rf-topbar-pill-text {
          display: none;
        }
      }

      .rf-table-responsive {
        width: 100%;
        overflow: visible;
        border-radius: 16px;
        background-color: transparent;
        min-height: auto;
        padding-bottom: 0;
      }

      .rf-filter-pills {
        display: flex;
        gap: 8px;
        margin-bottom: 22px;
        align-items: center;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding: 4px 0;
        width: 100%;
      }
      .rf-filter-pills::-webkit-scrollbar {
        display: none;
      }
    
      /* Mobile & Touch Responsiveness for Landing & Modal */
      .rf-landing-header {
        height: 68px;
        transition: padding 0.2s ease;
      }
      @media (max-width: 640px) {
        .rf-landing-header {
          padding: 0 16px !important;
          height: 60px !important;
        }
        .rf-landing-badge {
          display: none !important;
        }
      }

      @media (max-width: 768px) {
        .rf-signin-modal {
          flex-direction: column !important;
          max-width: 94vw !important;
          max-height: 92vh !important;
          overflow-y: auto !important;
          border-radius: 16px !important;
        }
        .rf-signin-modal-graphic {
          display: none !important;
        }
        .rf-signin-modal-content {
          flex: 1 1 100% !important;
          padding: 28px 20px !important;
        }
      }

      /* Mobile touch target minimums */
      @media (hover: none) and (pointer: coarse), (max-width: 640px) {
        button, a[role="button"], input[type="button"], input[type="submit"] {
          min-height: 44px;
        }
      }

    
      .rf-sidebar-collapsed {
        width: 68px !important;
      }
    </style>
  </head>
  <body>
    <div id="root" style="position: relative; z-index: 1;">
      <div style="min-height: 100vh; background-color: #000000; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background-color: #F7EFE2; color: #121214; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(247, 239, 226, 0.18);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
          <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #737373; text-transform: uppercase;">
            RELAYFORGE
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
