<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RelayForge — Developer Console</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F2F2F5'><path d='M13 10V3L4 14h7v7l9-11h-7z'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-0: #0E0E10;
        --color-1: #232327;
        --color-2: #3E3E45;
        --color-3: #63636E;
        --color-4: #9A9AA6;
        --color-5: #C9C9D2;
        --color-6: #F2F2F5;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #0E0E10;
        color: #F2F2F5;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      code, pre {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom scrollbar matching monochromatic palette */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0E0E10;
      }
      ::-webkit-scrollbar-thumb {
        background: #3E3E45;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #63636E;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
