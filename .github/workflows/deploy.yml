name: Production Release & Deployment Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  validate-and-gate:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://relayforge_api:relayforge_api_local@127.0.0.1:55433/relayforge_test
      WORKER_DATABASE_URL: postgresql://relayforge_worker:relayforge_worker_local@127.0.0.1:55433/relayforge_test
      MIGRATION_DATABASE_URL: postgresql://relayforge_admin:relayforge_admin_local@127.0.0.1:55433/relayforge_test
      REDIS_URL: redis://127.0.0.1:56380/0
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Code Quality & Lint
        run: npm run lint

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test

      - name: Build Web Application
        run: npm run build:web

      - name: Build Backend Bundles
        run: npm run build

      - name: Start Integration Test Infrastructure
        run: docker compose -f compose.test.yaml up -d --wait

      - name: Verify Database Migrations Apply Cleanly
        run: npm run db:migrate

      - name: Run Integration Test Suites
        run: npm run test:integration

      - name: Teardown Integration Test Infrastructure
        if: always()
        run: docker compose -f compose.test.yaml down

  build-containers:
    name: Build & Package Production Images
    needs: validate-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production API & Worker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          tags: relayforge:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Target Environment
    needs: build-containers
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deployment Execution Gate
        run: |
          echo "Release verification passed. Ready to deploy to target environment."
          echo "Version: ${{ github.ref_name }}"
