# RelayForge 100% Free Staging Infrastructure Blueprint (Render.com)
# Zero-card required: Uses free tiers for API, Worker, and Web
# Connected to free cloud databases (Supabase for PostgreSQL, Upstash for Redis)
version: "1"

services:
  # 1. RelayForge API Web Service (NestJS) - Free Tier
  - type: web
    name: relayforge-staging-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run start:api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0-staging
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3100
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_TIMEOUT_MS
        value: "3000"
      - key: DATABASE_URL
        sync: false # Paste Supabase PostgreSQL Connection String
      - key: REDIS_URL
        sync: false # Paste Upstash Redis TLS Connection String (rediss://...)
      - key: ENCRYPTION_KEY
        generateValue: true # Generates high-entropy 256-bit secret automatically
      - key: ALLOW_PRIVATE_DESTINATIONS
        value: "false"
      - key: SESSION_COOKIE_NAME
        value: rf_staging_session
      - key: FRONTEND_URL
        value: https://relayforge-staging-web.onrender.com
      - key: GITHUB_CALLBACK_URL
        value: https://relayforge-staging-api.onrender.com/auth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false # Paste GitHub OAuth App Client ID
      - key: GITHUB_CLIENT_SECRET
        sync: false # Paste GitHub OAuth App Client Secret

  # 2. RelayForge Background Outbox Worker (NestJS Daemon) - Free Tier
  # Runs as an isolated Web Service listening on /health for zero cloud costs
  - type: web
    name: relayforge-staging-worker
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run start:worker
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0-staging
      - key: LOG_LEVEL
        value: info
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: WORKER_HEARTBEAT_MS
        value: "10000"
      - key: QUEUE_PREFIX
        value: relayforge_staging
      - key: WORKER_DATABASE_URL
        fromService:
          type: web
          name: relayforge-staging-api
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: web
          name: relayforge-staging-api
          envVarKey: REDIS_URL
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: relayforge-staging-api
          envVarKey: ENCRYPTION_KEY
      - key: ALLOW_PRIVATE_DESTINATIONS
        value: "false"

  # 3. RelayForge Web Console (React Vite SPA) - Free Tier
  - type: web
    name: relayforge-staging-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./web/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
